name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual re-run: pick the tag (not a branch) in "Use workflow from".
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  goreleaser:
    # Only ever release from a v* tag. A "create" trigger used to fire a second
    # run per tag, which failed re-uploading the same assets (422 already_exists).
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to 26 on 2026-10-19
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
